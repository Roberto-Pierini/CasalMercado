<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
</head>
<body>
    <h1>Criar Conta</h1>
    
    {% if erro %}
    <p style="color: red;">{{ erro }}</p>
    {% endif %}

    {% if sucesso %}
    <p style="color: rgb(77, 235, 63);">{{ sucesso }}</p>
    {% endif %}

    <form method = "POST">
        {% csrf_token %}
        <br>
        <label>Usuário: </label>
        <input type="text" name="username" required>
        <br>
        <label> Email: </label>
        <input type="email" name="email" required>
        <br>
        <label> Senha: </label>
        <input type="password" name="password" required>
        <br>
        <br>
        <button type="submit">Cadastrar</button>
    </form>

    <p>Já tem conta? <a href ="/casal/login">Entre na sua conta</a></p>
</body>
</html>
