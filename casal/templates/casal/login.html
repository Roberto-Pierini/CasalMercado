{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'casal/style.css' %}">
</head>
<body>
    <h1>Entre na sua Conta</h1>
    
    {% if erro %}
    <p style="color: red;">{{ erro }}</p>
    {% endif %}

    <form method = "POST">
        {% csrf_token %}
        <br>
        <label>Usuário: </label>
        <input type="text" name="username" required>
        <br>
        <label> Senha: </label>
        <input type="password" name="password" required>
        <br>
        <br>
        <button type="submit">Logar</button>
    </form>
    <p>Não tem conta? <a href ="/casal/cadastro/">Cadastre se</a></p>
</body>
</html>
